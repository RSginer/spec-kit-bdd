installed:
- bdd
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: bdd
    command: speckit.bdd.scenarios
    enabled: true
    optional: true
    priority: 10
    prompt: Generate Gherkin acceptance scenarios from the spec before planning?
    description: Converts acceptance criteria into Gherkin feature files immediately
      after spec is written
    condition: null
  before_implement:
  - extension: bdd
    command: speckit.bdd.scaffold
    enabled: true
    optional: true
    priority: 10
    prompt: Scaffold step definition stubs before starting implementation?
    description: Creates step definition stubs so acceptance tests run (and fail)
      before any code is written
    condition: null
